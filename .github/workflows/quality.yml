name: Quality

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0 — pinned; credentials are not persisted so that no
      # authentication token can reach the uploaded archive artifacts.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-node v4.4.0 — pinned.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run complete quality gate
        run: npm run check
      # actions/upload-artifact v4.6.2 — pinned.
      - name: Upload deterministic artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runyth-order-${{ github.sha }}
          path: dist/
          if-no-files-found: error
