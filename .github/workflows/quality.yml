name: Quality

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 — pinned; credentials are not persisted so that no
      # authentication token can reach the uploaded archive artifacts.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-node v7.1.0 — pinned.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run complete quality gate
        run: npm run check
      # actions/upload-artifact v7.0.2 — pinned.
      - name: Upload deterministic artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runyth-order-${{ github.sha }}
          path: dist/
          if-no-files-found: error
