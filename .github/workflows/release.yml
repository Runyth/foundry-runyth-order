name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate and build
        run: npm run check
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const m=require("./module.json"); if (`v${m.version}` !== process.env.RELEASE_TAG) process.exit(1)'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/runyth-order-v*.zip
            dist/runyth-order-source-v*.zip
            dist/runyth-order-v*-SHA256SUMS.txt
            dist/runyth-order-v*-build-report.json
            module.json
