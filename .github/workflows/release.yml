name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 — pinned; credentials are not persisted so that no
      # authentication token can reach the reconstructed archive metadata.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # actions/setup-node v7.1.0 — pinned.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate and build
        env:
          RUNYTH_RELEASE_REF: ${{ github.ref }}
          RUNYTH_PUBLIC_RELEASE: "1"
        run: npm run check
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const m=require("./module.json"); if (`v${m.version}` !== process.env.RELEASE_TAG) process.exit(1)'
      # softprops/action-gh-release v3.0.3 — pinned.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231
        with:
          generate_release_notes: true
          files: |
            dist/runyth-order-v*.zip
            dist/runyth-order-source-v*.zip
            dist/runyth-order-v*-SHA256SUMS.txt
            dist/runyth-order-v*-build-report.json
            module.json
